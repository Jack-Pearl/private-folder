<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <title>Private Drive</title>
</head>
<body>

<h2>🔐 Login</h2>

<input id="email" value="hidden@site.com">
<input id="password" type="password" placeholder="Password">
<button onclick="login()">Login</button>

<hr>

<h3>📁 Files</h3>
<div id="files"></div>
<hr>

<h3>🎮 Control Panel</h3>

<button onclick="send('PAUSE')">⏸ Pause</button>
<button onclick="send('RESUME')">▶ Resume</button>
<button onclick="send('STOP')">⛔ Stop</button>

<hr>
<h3>📊 Status</h3>
<div id="status">Loading...</div>
  
<script type="module">
import { createClient } from "https://esm.sh/@supabase/supabase-js"

// ✅ ВАЖЛИВО: ВСТАВ СВІЙ URL І KEY
const supabase = createClient(
  "https://shttnxwespzupzskjivz.supabase.co",  // ← ВИПРАВЛЕНО
  "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNodHRueHdlc3B6dXB6c2tqaXZ6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzc4Mjg5NDgsImV4cCI6MjA5MzQwNDk0OH0.mBzleY85wsK_4vOCSs2WB0WwS349ftzl9o4NFdeV9-c"                        // ← ВИПРАВЛЕНО
)

// 🔐 LOGIN
window.login = async function () {
  const email = document.getElementById("email").value
  const password = document.getElementById("password").value

  const { error } = await supabase.auth.signInWithPassword({
    email,
    password
  })

  if (error) {
    alert("❌ Login failed: " + error.message)
    return
  }

  alert("✅ Logged in")
  loadFiles()
}

// ✅ АВТО-ПЕРЕВІРКА СЕСІЇ (ДОДАНО)
async function checkSession() {
  const { data } = await supabase.auth.getSession()
  if (data.session) {
    loadFiles()
  }
}
checkSession()

// 📁 LOAD FILES
async function loadFiles() {
  const { data, error } = await supabase
    .from("files")
    .select("*")

  if (error) {
    console.log(error)
    document.getElementById("files").innerHTML =
      "❌ Error loading files: " + error.message
    return
  }

  document.getElementById("files").innerHTML = data
    .map(f => `
      <div>
        📄 <a href="${f.url}" target="_blank">${f.name}</a>
      </div>
    `).join("")
}

// 🎮 SEND COMMAND
window.send = async function(cmd) {

  const { error } = await supabase
    .from("commands")
    .insert([{ command: cmd }])

  if (error) {
    alert("❌ Error: " + error.message)
    console.error(error)
  } else {
    console.log("✅ Sent:", cmd)
  }
}

// 📊 STATUS
async function loadStatus() {

  const { data, error } = await supabase
    .from("status")
    .select("*")
    .eq("id", 1)
    .single()

  if (error) {
    console.log(error)
    return
  }

  if (!data) return

  document.getElementById("status").innerHTML =
    data.index + " / " + data.total +
    "<br>ETA: " + data.eta + " sec"
}

// 🔄 автооновлення
setInterval(loadStatus, 1000)
  
</script>

</body>
