<!DOCTYPE html>
<html lang="uk">

  <meta charset="UTF-8">

<body>

<h2>🔐 Login</h2>

<input id="email" value="hidden@site.com">
<input id="password" type="password" placeholder="Password">
<button onclick="login()">Login</button>

<hr>

<h3>📁 Files</h3>
<div id="files"></div>
<hr>
 
<script type="module">
import { createClient } from "https://esm.sh/@supabase/supabase-js"

// ✔ FIXED CLIENT
const supabase = createClient(
  "https://shttnxwespzupzskjivz.supabase.co",
  "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNodHRueHdlc3B6dXB6c2tqaXZ6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzc4Mjg5NDgsImV4cCI6MjA5MzQwNDk0OH0.mBzleY85wsK_4vOCSs2WB0WwS349ftzl9o4NFdeV9-c"
)

// 🔐 LOGIN
const email = "hidden@site.com"

window.login = async function () {
  const password = document.getElementById("password").value

  const { error } = await supabase.auth.signInWithPassword({
    email,
    password
  })

  if (error) {
    alert("❌ Login failed: " + error.message)
    return
  }

  alert("✅ Logged in")
  loadFiles()
}

// 📁 LOAD FILES
async function loadFiles() {
  const { data, error } = await supabase
    .from("files")
    .select("*")

  if (error) {
    console.log(error)
    document.getElementById("files").innerHTML =
      "❌ Error loading files: " + error.message
    return
  }

  document.getElementById("files").innerHTML = data
    .map(f => `
      <div>
        📄 <a href="${f.url}" target="_blank">${f.name}</a>
      </div>
    `).join("")
}


  async function loadStatus() {

  const { data } = await supabase
    .from("status")
    .select("*")
    .eq("id", 1)
    .single()

  if (!data) return

  document.getElementById("status").innerHTML =
    data.index + " / " + data.total +
    "<br>ETA: " + data.eta + " sec"
}

  setInterval(loadStatus, 1000)
  
</script>

</body>
</html>
